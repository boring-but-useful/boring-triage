[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-triage"
version = "0.1.0"
description = "Human-gated review of synthetic cloud incident evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "openai==3.22.1",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[project.scripts]
boring-triage = "boring_triage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
show_error_codes = true
warn_unreachable = true
